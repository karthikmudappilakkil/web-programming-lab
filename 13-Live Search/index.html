<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 13 - Live User Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Live User Search</h1>
    <p>Search sample users by name, city, or company.</p>
    <label for="searchInput">Search</label>
    <input type="search" id="searchInput" placeholder="Start typing a name, city, or company" disabled>
    <p id="message" aria-live="polite">Loading users...</p>
    <ul id="results"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
