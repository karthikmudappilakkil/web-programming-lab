<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 15 - User Authentication</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>User Authentication</h1>
    {% if message %}<p class="message error" role="status">{{ message }}</p>{% endif %}
    <div class="forms">
      <section class="card">
        <h2>Register</h2>
        <form action="{{ url_for('register') }}" method="post">
          <label for="name">Name</label>
          <input id="name" name="name" maxlength="100" required>
          <label for="register-email">Email</label>
          <input id="register-email" name="email" type="email" maxlength="200" required>
          <label for="register-password">Password</label>
          <input id="register-password" name="password" type="password" minlength="6" required>
          <button type="submit">Create Account</button>
        </form>
      </section>
      <section class="card">
        <h2>Log In</h2>
        <form action="{{ url_for('login') }}" method="post">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" required>
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" required>
          <button type="submit">Log In</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
